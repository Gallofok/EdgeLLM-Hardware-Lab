name: Software validation (no Pi performance claims)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: ruff check . && ruff format --check .
      - run: shellcheck scripts/pi/*.sh
      - run: python -m unittest discover -s tests -v
      - name: Fixture end-to-end report (synthetic, not ARM performance)
        run: |
          bash scripts/pi/benchmark.sh --fixture --output results/pi3/ci-fixture --reports reports/ci-fixture
          python scripts/report.py --input results/pi3/ci-fixture --reports reports/ci-fixture
      - name: Fixture inference-profile workflow (no model or PMU)
        run: |
          python scripts/profiling/run.py --fixture --output results/profiling/ci-fixture
          python scripts/profiling/report.py --input results/profiling/ci-fixture --reports reports/profiling-ci-fixture
      - name: Fixture Q5 reference/upstream reporting (synthetic)
        run: |
          python scripts/quantized/run.py --fixture --sessions 1 --output results/quantized/ci-fixture
          python scripts/quantized/report.py --input results/quantized/ci-fixture --reports reports/q5-ci-fixture
      - name: Fixture Q5 NEON triplet reports (synthetic, no ARM kernel)
        run: |
          python scripts/quantized/neon_run.py --fixture --sessions 1 --output results/quantized/neon-ci-fixture
          python scripts/quantized/neon_report.py --input results/quantized/neon-ci-fixture --reports reports/q5-neon-ci-fixture
      - name: Fixture original/integrated paired inference report
        run: |
          python scripts/integration/perf_run.py --fixture --output build/e2e-fixture
          python scripts/integration/perf_report.py --input build/e2e-fixture --reports build/e2e-report
      - name: Fixture three-way same-binary control (synthetic)
        run: |
          python scripts/integration/perf_run.py --ablation --fixture --output build/ablation-fixture
          python scripts/integration/ablation_report.py --input build/ablation-fixture --reports build/ablation-report
      - name: Validate recorded Pi evidence (no inference)
        run: |
          python scripts/report.py --input results/pi3/baseline-20261031 --reports build/verified-reports/baseline
          python scripts/report.py --input results/pi3/context-20261031 --reports build/verified-reports/context
          python scripts/kernels/report.py --input results/kernels/neon-20261031 --reports build/verified-reports/neon
          python scripts/profiling/report.py --input results/profiling/pi3-20261031 --reports build/verified-reports/profile
          python scripts/quantized/report.py --input results/quantized/q5-20261031 --reports build/verified-reports/q5
          python scripts/quantized/neon_report.py --input results/quantized/neon-20261031 --reports build/verified-reports/q5-neon
          python scripts/quantized/path_profile.py report --input results/quantized/path-profile-20261031 --output build/verified-reports/q5-path-profile
          python scripts/integration/report.py --input results/integration/ggml-20261031 --reports build/verified-reports/ggml
          python scripts/integration/perf_report.py --input results/integration/e2e-20261031 --reports build/verified-reports/e2e
          python scripts/integration/ablation_report.py --input results/integration/three-way-20261031 --reports build/verified-reports/three-way
          python scripts/quantized/two_block_profile.py report --input results/quantized/two-block-20261101 --output build/verified-reports/q5-two-block
      - name: C++17 scalar kernel correctness and benchmark smoke (host only)
        run: |
          cmake -S . -B build/kernels -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/kernels --parallel 2
          ctest --test-dir build/kernels --output-on-failure
          python scripts/kernels/benchmark.py --build build/kernels --output results/kernels/ci-host --min-ms 1 --repetitions 2
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-only-python-${{ matrix.python }}
          path: |
            results/pi3/ci-fixture/
            reports/ci-fixture/
            results/profiling/ci-fixture/
            reports/profiling-ci-fixture/
            results/quantized/ci-fixture/
            reports/q5-ci-fixture/
            results/quantized/neon-ci-fixture/
            reports/q5-neon-ci-fixture/
  neon-correctness-emulated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 cross compiler and instruction emulator
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu qemu-user
      - name: Cross-build and execute numerical tests (not physical ARM performance)
        run: |
          cmake -S . -B build/arm64-emulated -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            '-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-aarch64;-L;/usr/aarch64-linux-gnu'
          cmake --build build/arm64-emulated --parallel 2
          ctest --test-dir build/arm64-emulated --output-on-failure

      - name: Pinned GGML row4 graph correctness under ARM64 emulation
        run: |
          git init vendor/llama.cpp
          git -C vendor/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C vendor/llama.cpp fetch --depth 1 origin a7a98e0fffed794396b3fbad4dcdbbc184963645
          git -C vendor/llama.cpp checkout --detach FETCH_HEAD
          python3 scripts/integration/prepare.py
          cmake -S integrations/ggml -B build/ggml-emulated -DCMAKE_BUILD_TYPE=Release \
            -DGGML_EDGELLM_Q5_ROW4=ON -DEDGELLM_BUILD_LLAMA_BENCH=ON -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            '-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-aarch64;-L;/usr/aarch64-linux-gnu'
          cmake --build build/ggml-emulated --target test-ggml-row4 edgellm-llama-bench --parallel 2
          qemu-aarch64 -L /usr/aarch64-linux-gnu build/ggml-emulated/edgellm-llama-bench --help
          ctest --test-dir build/ggml-emulated --output-on-failure
          cmake -S integrations/ggml -B build/ggml-default -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            '-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-aarch64;-L;/usr/aarch64-linux-gnu'
          cmake --build build/ggml-default --target test-ggml-row4 --parallel 2
          ctest --test-dir build/ggml-default --output-on-failure
      - name: Two-block candidate graph correctness under ARM64 emulation
        run: |
          cmake -S integrations/ggml -B build/ggml-two-block -DCMAKE_BUILD_TYPE=Release \
            -DGGML_EDGELLM_Q5_ROW4=ON -DEDGELLM_Q5_TWO_BLOCK=ON -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            '-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-aarch64;-L;/usr/aarch64-linux-gnu'
          cmake --build build/ggml-two-block --target test-ggml-row4 --parallel 2
          ctest --test-dir build/ggml-two-block --output-on-failure
